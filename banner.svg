<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Gaurav Singh - Data Scientist, GenAI and RAG Builder, BI Analytics" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:800 58px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F8FAFC;letter-spacing:1px;animation:fade 1.2s ease-out both}
      .role{font:500 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E0F2FE;letter-spacing:1.5px;animation:fade 1.6s ease-out both}
      .tag{font:400 14px 'Courier New',monospace;fill:#BAE6FD;animation:fade 2s ease-out both}
      .float{animation:bob 6s ease-in-out infinite}
      .float2{animation:bob 8s ease-in-out infinite reverse}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    </style>
  </defs>
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <g class="float"><circle cx="880" cy="70" r="60" fill="#ffffff" fill-opacity="0.07"/><circle cx="880" cy="70" r="30" fill="#ffffff" fill-opacity="0.08"/></g>
  <g class="float2"><circle cx="120" cy="215" r="45" fill="#ffffff" fill-opacity="0.06"/></g>
  <g stroke="#E0F2FE" stroke-opacity="0.35" stroke-width="1.5" fill="#E0F2FE">
    <line x1="780" y1="190" x2="850" y2="150"/><line x1="850" y1="150" x2="920" y2="200"/><line x1="850" y1="150" x2="900" y2="95"/>
    <circle cx="780" cy="190" r="5"/><circle cx="850" cy="150" r="7"/><circle cx="920" cy="200" r="5"/><circle cx="900" cy="95" r="5"/>
  </g>
  <text x="500" y="115" text-anchor="middle" class="name">Gaurav Singh</text>
  <rect x="300" y="135" width="400" height="2" fill="url(#line)"/>
  <text x="500" y="175" text-anchor="middle" class="role">DATA SCIENTIST  •  GENAI &amp; RAG BUILDER  •  BI ANALYTICS</text>
  <text x="500" y="212" text-anchor="middle" class="tag">&lt;grounded answers · vector search · executive insights /&gt;</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
